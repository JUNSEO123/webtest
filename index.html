<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Test - Hello World</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 { font-size: 3rem; margin: 0; }
        p { font-size: 1.2rem; opacity: 0.8; margin-top: 1rem; }
        .status {
            margin-top: 2rem;
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: #4ade80;
            color: #064e3b;
            border-radius: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello World! 🚀</h1>
        <p>다른 서버에서 이 페이지가 보인다면 테스트 성공입니다.</p>
        <div class="status">Server is Online</div>
    </div>
</body>
</html>
